name: Build Android APK

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:

      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4


      # Android SDK requires Java 17+
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          architecture: x64


      # Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # Install required SDK versions
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-29" \
            "build-tools;29.0.3"


      # Fix Gradle wrapper URL
      - name: Fix Gradle wrapper
        run: |
          sed -i \
          's#^distributionUrl=.*#distributionUrl=https\://services.gradle.org/distributions/gradle-5.4.1-all.zip#' \
          gradle/wrapper/gradle-wrapper.properties

          cat gradle/wrapper/gradle-wrapper.properties


      # Old Android Gradle Plugin needs Java 8
      - name: Setup Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          architecture: x64


      # Fix permissions
      - name: Fix permissions
        run: |
          chmod +x ./gradlew

          chmod -R +x "$JAVA_HOME/bin" || true

          echo "Gradle:"
          ls -la ./gradlew

          echo "Java:"
          ls -la "$JAVA_HOME/bin/java"


      # Check Java
      - name: Check Java
        run: |
          java -version
          "$JAVA_HOME/bin/java" -version


      # Cache Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-


      # Remove Firebase plugin if config missing
      - name: Prepare Firebase
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo "google-services.json missing"

            sed -i "/apply plugin: 'com.google.gms.google-services'/d" app/build.gradle
          fi


      # Build APK
      - name: Build Debug APK
        run: |
          echo "Building APK..."

          chmod +x ./gradlew

          bash ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace


      # Find APK
      - name: Find APK
        run: |
          find app/build/outputs/apk -name "*.apk"


      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
