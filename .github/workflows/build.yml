name: Windows VM Session

on:
  workflow_dispatch:

jobs:
  windows:
    name: Windows 6 Hour VM
    runs-on: windows-2025

    timeout-minutes: 360

    steps:
      - name: Show Windows information
        shell: powershell
        run: |
          Write-Host "=== Windows ==="
          Get-ComputerInfo |
            Select-Object WindowsProductName,
                          WindowsVersion,
                          OsBuildNumber,
                          OsArchitecture

      - name: Show hardware
        shell: powershell
        run: |
          Write-Host "=== CPU ==="
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfLogicalProcessors

          Write-Host "=== RAM ==="
          Get-CimInstance Win32_ComputerSystem |
            Select-Object @{
              Name="RAM_GB"
              Expression={[math]::Round($_.TotalPhysicalMemory / 1GB, 2)}
            }

          Write-Host "=== Disk ==="
          Get-PSDrive C |
            Select-Object Used,Free

      - name: Keep VM running
        shell: powershell
        run: |
          Write-Host "Windows runner is active."
          Write-Host "Maximum job duration: 6 hours."

          for ($i = 1; $i -le 360; $i++) {
              Write-Host "VM active - minute $i / 360"
              Start-Sleep -Seconds 60
          }
