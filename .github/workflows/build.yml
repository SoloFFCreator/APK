name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17


    - name: Setup Android SDK
      uses: android-actions/setup-android@v3


    - name: Install SDK
      run: |
        yes | sdkmanager --licenses || true

        sdkmanager \
        "platform-tools" \
        "platforms;android-29" \
        "build-tools;29.0.3"


    - name: Fix Gradle URL
      run: |
        sed -i \
        's#^distributionUrl=.*#distributionUrl=https://services.gradle.org/distributions/gradle-5.4.1-all.zip#' \
        gradle/wrapper/gradle-wrapper.properties


    - name: Install Gradle
      run: |
        wget https://services.gradle.org/distributions/gradle-5.4.1-bin.zip

        unzip -q gradle-5.4.1-bin.zip

        echo "$PWD/gradle-5.4.1/bin" >> $GITHUB_PATH


    - name: Check Gradle
      run: |
        gradle --version


    - name: Remove Firebase plugin
      run: |
        if [ ! -f app/google-services.json ]; then
          sed -i "/apply plugin: 'com.google.gms.google-services'/d" app/build.gradle
        fi


    - name: Build APK
      run: |
        gradle assembleDebug --stacktrace --no-daemon


    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: APK
        path: app/build/outputs/apk/debug/*.apk
